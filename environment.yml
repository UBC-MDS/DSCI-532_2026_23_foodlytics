name: dsci532

channels:
  - conda-forge

dependencies:
  - python>=3.11,<3.12
  - pip

  # Data
  - pandas>=2.0
  - numpy>=1.24

  # Visualization
  - plotly>=5.18
  - altair>=5.0
  - vega_datasets

  # Shiny stack (all conda-forge)
  - shiny>=0.7
  - shinywidgets>=0.7
  - anywidget

  # Jupyter
  - jupyterlab>=4.0
  - ipykernel>=6.25

  # pip-only packages LAST
  - pip:
      - kaggle>=1.6
      - faicons
      - querychat
      - chatlas
      - python-dotenv